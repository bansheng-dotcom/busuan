[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laoshifu-mcp"
version = "0.1.0"
description = "老师傅 MCP 服务器：真实八字+紫微双盘与六爻+奇门双法同参排盘工具"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "william22820785-cmyk" }]
keywords = ["mcp", "bazi", "ziwei", "liuyao", "qimen", "chinese-metaphysics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["mcp>=2.2.0,<3"]

[project.urls]
Homepage = "https://skillhub.cn/skills/user_78ca2e3b/laoshifu"

[project.scripts]
laoshifu-mcp = "laoshifu_mcp.server:main"

[tool.setuptools]
packages = ["laoshifu_mcp"]
include-package-data = true

[tool.setuptools.package-data]
laoshifu_mcp = ["_runtime/**/*"]
